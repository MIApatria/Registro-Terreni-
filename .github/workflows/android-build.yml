name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/registro-terreni.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: registro-terreni-debug-apk
          path: out/registro-terreni.apk
          if-no-files-found: error

      # Pubblica l'APK come Release con link diretto fisso (nessun login, nessun ZIP):
      # https://github.com/MIApatria/Registro-Terreni-/releases/latest/download/registro-terreni.apk
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Registro Terreni 1.0.${{ github.run_number }}
          files: out/registro-terreni.apk
          make_latest: "true"
